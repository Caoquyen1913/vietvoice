plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.vietvoice.app'
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.vietvoice.app"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters 'arm64-v8a'   // máy hiện đại đều arm64; bỏ các ABI thừa để giảm APK
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
    packagingOptions {
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
    }
    // Prevent AAPT from re-compressing already-compressed model archives
    aaptOptions {
        noCompress "zip", "bz2"
    }
}

// ─────────────────────────────────────────────────────────────────────────────
// Pre-bundle all 4 model archives into assets/models/ at build time so the
// installed APK needs NO internet download. Skips files already present.
// ─────────────────────────────────────────────────────────────────────────────
task downloadBundledModels {
    doLast {
        def modelsDir = file("src/main/assets/models")
        modelsDir.mkdirs()

        def models = [
            ["vosk-model-small-cn-0.22.zip",
             "https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip"],
            ["vosk-model-vn-0.4.zip",
             "https://alphacephei.com/vosk/models/vosk-model-vn-0.4.zip"],
            ["vits-piper-vi_VN-vais1000-medium.tar.bz2",
             "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-vi_VN-vais1000-medium.tar.bz2"],
            ["vits-zh-hf-fanchen-C.tar.bz2",
             "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-zh-hf-fanchen-C.tar.bz2"]
        ]

        models.each { entry ->
            def filename = entry[0]
            def urlStr   = entry[1]
            def dest     = new File(modelsDir, filename)

            if (dest.exists()) {
                println "  [skip] ${filename} (${dest.length() / 1048576}MB already bundled)"
                return
            }

            println "  [download] ${filename} ..."
            def currentUrl = urlStr
            def done = false
            for (int i = 0; i < 10 && !done; i++) {
                def conn = (java.net.HttpURLConnection) new URL(currentUrl).openConnection()
                conn.instanceFollowRedirects = false
                conn.connect()
                def code = conn.responseCode
                if (code >= 300 && code < 400) {
                    currentUrl = conn.getHeaderField('Location')
                    conn.disconnect()
                } else {
                    dest.withOutputStream { out ->
                        conn.inputStream.withStream { inp -> out << inp }
                    }
                    conn.disconnect()
                    done = true
                }
            }
            if (done) println "  [done]  ${filename} (${dest.length() / 1048576}MB)"
            else throw new GradleException("Too many redirects for: ${urlStr}")
        }
    }
}

preBuild.dependsOn(downloadBundledModels)

dependencies {
    // sherpa-onnx offline TTS engine — AAR downloaded in CI (app/libs/*.aar)
    implementation fileTree(dir: 'libs', include: ['*.aar'])
    // giải nén .tar.bz2 model giọng tiếng Việt (thuần Java, không cần native)
    implementation 'org.apache.commons:commons-compress:1.27.1'

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.alphacephei:vosk-android:0.3.47'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    implementation 'com.google.mlkit:translate:17.0.2'
}
